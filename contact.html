<body>

<!-- HEADER -->
<header class="site-header">
  <div class="site-container header-inner">
    <a href="index.html" class="logo" aria-label="Home"><i class="fa-regular fa-house"></i></a>

    <nav class="main-nav" id="main-nav">
      <a href="works.html">Works</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="nav-btn">Contact me</a>
    </nav>

    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Apri menu" aria-expanded="false" aria-controls="main-nav">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>
</header>

<!-- HERO -->
<section class="hero-about">

  <!-- BREADCRUMBS -->
  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <div class="site-container breadcrumbs-inner">
      <ol class="breadcrumbs-list">
        <li><a href="index.html" class="breadcrumbs-link">Home</a></li>
        <li class="breadcrumbs-sep" aria-hidden="true">/</li>
        <li class="breadcrumbs-current" aria-current="page">Contact</li>
      </ol>
    </div>
  </nav>

  <div class="site-container hero-about-inner">
    <div class="page-header">
      <div class="page-header-top">
        <span class="eyebrow">Let's talk</span>
        <h1 class="page-title">Contact Me</h1>
      </div>
    </div>
  </div>
</section>

<!-- CONTACT FORM -->
<section class="section contact-form-section" id="contact">
  <div class="site-container">
    <div class="contact-form-card">
      <div class="contact-form-intro">
        <h2 class="contact-form-title">Send me a message</h2>
        <p class="contact-form-text">
          Have a project in mind, a question, or just want to say hi?
          Fill in the form below and I'll get back to you as soon as possible.
        </p>
      </div>

      <form id="contact-form" class="footer-form" action="https://formsubmit.co/anna.bonadimani@outlook.com" method="POST">
        <input type="hidden" name="_subject" value="Nuovo messaggio dal portfolio">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="true">

        <div class="row g-4">
          <div class="col-12 col-md-6 footer-field">
            <label for="cf-name">Name</label>
            <input type="text" id="cf-name" name="Nome" placeholder="Your name" required>
          </div>
          <div class="col-12 col-md-6 footer-field">
            <label for="cf-email">Email</label>
            <input type="email" id="cf-email" name="Email" placeholder="Your email" required>
          </div>
        </div>

        <div class="footer-field">
          <label for="cf-message">Message</label>
          <textarea id="cf-message" name="Messaggio" rows="4" placeholder="Write your message here..." required></textarea>
        </div>

        <button type="submit" class="footer-submit">Send Message</button>
      </form>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="site-container">

    <hr class="footer-divider">

    <div class="footer-bottom">
      <p class="footer-contact">
        2026 © Anna Bonadimani. All rights reserved.
      </p>
      <div class="footer-social">
        <span class="footer-social-label">Follow me</span>
        <nav class="footer-nav">
          <a href="https://www.linkedin.com/in/anna-bonadimani/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
               <i class="fa-brands fa-linkedin iconsize"></i>
          </a>
          <a href="https://www.behance.net/annabonadimani" target="_blank" rel="noopener noreferrer" aria-label="Behance">
               <i class="fa-brands fa-behance iconsize"></i>
          </a>
          <a href="https://github.com/annabonad" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                           <i class="fa-brands fa-github iconsize"></i>
          </a>
        </nav>
      </div>
    </div>

  </div>
</footer>

<script src="assets/js/nav.js"></script>
</body>
</html>
